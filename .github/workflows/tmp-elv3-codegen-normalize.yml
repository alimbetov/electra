name: Temporary ELV3 Codegen Normalize

on:
  push:
    branches:
      - feat/elv3-runtime-closure
    paths:
      - '.github/workflows/tmp-elv3-codegen-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/elv3-runtime-closure
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        working-directory: apps/mobile
        run: dart run build_runner build

      - name: Format mobile source and tests
        working-directory: apps/mobile
        run: dart format lib test

      - name: Commit normalized generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib apps/mobile/test
          git diff --cached --quiet && exit 0
          git commit -m 'chore(elv3): regenerate Drift runtime schema'
          git pull --rebase origin feat/elv3-runtime-closure
          git push origin HEAD:feat/elv3-runtime-closure
