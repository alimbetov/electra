name: Temporary ELV4 Drift Format Fix

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - '.github/workflows/tmp-elv4-drift-format-fix.yml'

permissions:
  contents: write

jobs:
  normalize-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        working-directory: apps/mobile
        run: dart run build_runner build

      - name: Format mobile Dart sources
        working-directory: apps/mobile
        run: dart format lib test

      - name: Commit generated and formatter diff
        run: |
          if git diff --quiet -- apps/mobile/lib apps/mobile/test; then
            echo 'No Drift/format changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib apps/mobile/test
          git commit -m 'fix(elv4): normalize Drift generation and formatting'
          git push origin HEAD:feat/flutter-elv4-power-topology-design
