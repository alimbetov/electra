name: P4.2 Schema Assertions

on:
  push:
    branches:
      - 'feat/flutter-elv2-profile-constraints'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update schema assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('apps/mobile/test/data').glob('*.dart'):
              text = path.read_text()
              updated = text.replace('schemaVersion, 16', 'schemaVersion, 17')
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          print('\n'.join(changed))
          if not changed:
              raise SystemExit('No schemaVersion 16 assertions found')
          PY
      - name: Commit assertions
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/test/data
          git commit -m "test: expect schema version 17"
          git push origin HEAD:feat/flutter-elv2-profile-constraints
