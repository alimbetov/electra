name: ELV5 Schema24 Apply Once

on:
  push:
    branches:
      - feat/flutter-elv5-power-topology-design
    paths:
      - .github/workflows/elv5-schema24-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv5-power-topology-design
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fix one-shot placement guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/apply-elv5-p2-schema24-runtime.py')
          text = path.read_text(encoding='utf-8')
          old = "if pos < 0 or '_createDisciplineIndexesAndGuards' in text[:pos]:"
          new = "if pos < 0 or 'Future<void> _createDisciplineIndexesAndGuards()' in text[:pos]:"
          if text.count(old) != 1:
              raise SystemExit('schema24 apply guard anchor drift')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Apply schema-24 patch
        run: python3 scripts/ci/apply-elv5-p2-schema24-runtime.py
      - name: Format ELV5 P0-P2 sources
        run: |
          dart format \
            apps/mobile/lib/data/database/app_database.dart \
            apps/mobile/lib/data/database/power_database_tables.dart \
            apps/mobile/lib/data/database/discipline_database_tables.dart \
            apps/mobile/test/application/elv5_wire_command_codec_test.dart \
            packages/engineering_core/lib/engineering_core_elv5.dart \
            packages/engineering_core/lib/src/elv5 \
            packages/engineering_core/test/elv5_p0_p1_foundation_test.dart
      - name: Remove one-shot tooling and commit
        run: |
          git rm .github/workflows/elv5-schema24-apply-once.yml
          git rm scripts/ci/apply-elv5-p2-schema24-runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/data/database/app_database.dart \
                  apps/mobile/lib/data/database/power_database_tables.dart \
                  apps/mobile/lib/data/database/discipline_database_tables.dart \
                  apps/mobile/test/application/elv5_wire_command_codec_test.dart \
                  packages/engineering_core/lib/engineering_core_elv5.dart \
                  packages/engineering_core/lib/src/elv5 \
                  packages/engineering_core/test/elv5_p0_p1_foundation_test.dart
          git commit -m "feat(elv5): integrate schema 24 into AppDatabase"
          git push origin HEAD:feat/flutter-elv5-power-topology-design
