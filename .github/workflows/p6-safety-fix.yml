name: P6 Safety Fix

on:
  push:
    branches:
      - feat/flutter-elv2-profile-constraints
    paths:
      - '.github/workflows/p6-safety-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv2-profile-constraints
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fix canonical compatibility lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/test/data/engineering_reference_adoption_safety_test.dart')
          s = p.read_text()
          old = "profile.identity.code == 'CCTV-POE'"
          new = "profile.semanticCode == 'CCTV-POE'"
          if old not in s:
              raise SystemExit('expected profile lookup not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Generate and format
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          dart format test/data/engineering_reference_adoption_safety_test.dart
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: P6 safety tests
        working-directory: apps/mobile
        run: flutter test test/data/engineering_reference_adoption_safety_test.dart test/data/engineering_reference_adoption_persistence_test.dart
      - name: Commit safety acceptance and remove helpers
        run: |
          rm -f .github/workflows/p6-safety-verify.yml .github/workflows/p6-safety-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(elv2): close P6 connection safety acceptance'
          git push origin HEAD:feat/flutter-elv2-profile-constraints
