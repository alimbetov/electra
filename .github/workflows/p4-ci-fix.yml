name: P4 CI Fix

on:
  push:
    branches:
      - 'feat/flutter-elv2-profile-constraints'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale Drift import
        run: |
          sed -i "/package:drift\/drift.dart/d" apps/mobile/test/data/engineering_placement_repository_test.dart
          git diff --check
      - name: Commit clean fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/p4-ci-fix.yml
          git add apps/mobile/test/data/engineering_placement_repository_test.dart
          git commit -m "test(elv2): remove stale drift import"
          git push origin HEAD:feat/flutter-elv2-profile-constraints
