name: Premerge Normalize Flutter Foundation

on:
  push:
    branches:
      - feat/flutter-local-app-foundation

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/flutter-local-app-foundation

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Normalize Dart formatting
        working-directory: apps/mobile
        run: dart format lib test

      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/pubspec.lock apps/mobile/lib apps/mobile/test
          if git diff --cached --quiet; then
            echo "Nothing to normalize"
            exit 0
          fi
          git commit -m "style(mobile): normalize foundation sources and lock dependencies"
          git push origin HEAD:feat/flutter-local-app-foundation

