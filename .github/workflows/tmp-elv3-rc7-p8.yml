name: Temporary ELV3 RC7 P8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/elv3-runtime-closure
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply RC7 patch
        run: python3 scripts/ci/apply-elv3-runtime-rc7.py
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Generate Drift code
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Format
        working-directory: apps/mobile
        run: dart format lib test
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test P8 verticals
        working-directory: apps/mobile
        run: flutter test --reporter expanded test/data/elv_p8_vertical_matrix_test.dart
      - name: Commit RC7 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/test/data/elv_p8_vertical_matrix_test.dart
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'test(elv3): close RC7 P8 vertical SQLite matrix'
          git pull --rebase origin feat/elv3-runtime-closure
          git push origin HEAD:feat/elv3-runtime-closure
