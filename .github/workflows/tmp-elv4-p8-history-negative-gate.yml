name: ELV4 P8 History Negative Gate

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - .github/workflows/tmp-elv4-p8-history-negative-gate.yml
      - apps/mobile/test/data/elv4_p8_freeze_historical_invariance_test.dart

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Narrow Drift import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/test/data/elv4_p8_freeze_historical_invariance_test.dart')
          text = path.read_text()
          text = text.replace("import 'package:drift/drift.dart';", "import 'package:drift/drift.dart' show Value;")
          path.write_text(text)
          PY
      - name: Format P8 history acceptance
        working-directory: apps/mobile
        run: dart format test/data/elv4_p8_freeze_historical_invariance_test.dart
      - name: Run P8 historical acceptance
        working-directory: apps/mobile
        run: flutter test test/data/elv4_p8_freeze_historical_invariance_test.dart
      - name: Commit verified test
        run: |
          if git diff --quiet -- apps/mobile/test/data/elv4_p8_freeze_historical_invariance_test.dart; then
            echo 'P8 history test already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/test/data/elv4_p8_freeze_historical_invariance_test.dart
          git commit -m 'test(elv4): normalize legacy power history acceptance'
          git push origin HEAD:feat/flutter-elv4-power-topology-design
