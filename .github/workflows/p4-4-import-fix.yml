name: P4.4 Import Fix

on:
  push:
    branches:
      - 'feat/flutter-elv2-profile-constraints'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fix drift matcher namespace collision
        run: |
          python -c "from pathlib import Path; p=Path('apps/mobile/test/data/engineering_placement_repository_test.dart'); t=p.read_text(); old=\"import 'package:drift/drift.dart';\"; new=\"import 'package:drift/drift.dart' hide isNotNull, isNull;\"; assert old in t; p.write_text(t.replace(old,new,1))"
          cd apps/mobile
          dart format test/data/engineering_placement_repository_test.dart
      - name: Commit test import fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/test/data/engineering_placement_repository_test.dart
          git commit -m "test(elv2): disambiguate P4.4 drift matchers"
          git push origin HEAD:feat/flutter-elv2-profile-constraints
