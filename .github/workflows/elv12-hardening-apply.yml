name: ELV12 Hardening Apply

on:
  push:
    branches:
      - feat/flutter-elv12-pre-elv3-hardening

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded H1-H3 hardening
        run: python3 .github/scripts/elv12_hardening_apply.py

      - name: Verify bounded diff
        run: |
          git diff --check
          git status --short

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(elv): harden ELV1-2 baseline before ELV3"
          git push origin HEAD:feat/flutter-elv12-pre-elv3-hardening
