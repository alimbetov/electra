name: Temporary ELV3 RC5 P6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/elv3-runtime-closure
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply RC5 patch
        run: python3 scripts/ci/apply-elv3-runtime-rc5.py
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Generate Drift code
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Format
        working-directory: apps/mobile
        run: dart format lib test
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test P6
        working-directory: apps/mobile
        run: flutter test --reporter expanded test/data/elv_p6_runtime_closure_test.dart
      - name: Commit RC5 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib/application/elv_physical_calculation_service.dart \
                  apps/mobile/test/data/elv_p6_runtime_closure_test.dart
          git diff --cached --quiet && { echo 'No changes produced'; exit 1; }
          git commit -m 'feat(elv3): implement RC5 P6 revision-scoped calculations'
          git push origin HEAD:feat/elv3-runtime-closure
