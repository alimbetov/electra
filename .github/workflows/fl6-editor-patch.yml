name: Apply FL6 Editor Integration

on:
  push:
    branches:
      - feat/flutter-geometry-kernel

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-geometry-kernel
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Disambiguate ToolContext anchor
        run: >-
          python3 -c "from pathlib import Path; p=Path('.github/scripts/patch_fl6_editor.py'); t=p.read_text(); old='  final SurfacePatch? adjacentPreviewPatch;\\n\\n  @override\\n  Widget build(BuildContext context) {\\n'; new='  final SurfaceEdgeCandidate? navigationCandidate;\\n  final SurfacePatch? adjacentPreviewPatch;\\n\\n  @override\\n  Widget build(BuildContext context) {\\n'; replacement='  final SurfaceEdgeCandidate? navigationCandidate;\\n  final SurfacePatch? adjacentPreviewPatch;\\n  final ComponentDefinition? activeComponentDefinition;\\n  final bool placingComponent;\\n\\n  @override\\n  Widget build(BuildContext context) {\\n'; assert t.count(old)==1 or t.count(old)==2; t=t.replace('replace_once(\\n    \\\"'+old.replace('\\n','\\\\n')+'\\\",\\n    \\\"  final SurfacePatch? adjacentPreviewPatch;\\\\n\\\"\\n    \\\"  final ComponentDefinition? activeComponentDefinition;\\\\n\\\"\\n    \\\"  final bool placingComponent;\\\\n\\\\n\\\"\\n    \\\"  @override\\\\n\\\"\\n    \\\"  Widget build(BuildContext context) {\\\\n\\\",\\n)', 'replace_once(\\n    \\\"'+new.replace('\\n','\\\\n')+'\\\",\\n    \\\"'+replacement.replace('\\n','\\\\n')+'\\\",\\n)'); p.write_text(t)"
      - run: python3 .github/scripts/patch_fl6_editor.py
      - working-directory: apps/mobile
        run: dart format lib/features/editor/room_editor_screen.dart
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/features/editor/room_editor_screen.dart
          git commit -m "feat(mobile): integrate persisted repeated component placement"
          git push origin HEAD:feat/flutter-geometry-kernel
