name: ELV4 P8 Freeze Acceptance Gate

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - .github/workflows/tmp-elv4-p8-freeze-acceptance-gate.yml
      - apps/mobile/test/data/elv4_p8_freeze_historical_invariance_test.dart

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Verify test formatting
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed test/data/elv4_p8_freeze_historical_invariance_test.dart
      - name: Analyze mobile
        working-directory: apps/mobile
        run: flutter analyze
      - name: Run P8 freeze historical acceptance
        working-directory: apps/mobile
        run: flutter test test/data/elv4_p8_freeze_historical_invariance_test.dart test/data/elv4_p7_freeze_integration_test.dart test/data/elv_p3_runtime_closure_test.dart
