name: Temporary ELV4 P2 Schema Integrator

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - '.github/workflows/tmp-elv4-p2-schema.yml'

permissions:
  contents: write

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Wire ELV4 schema v22
        run: python3 scripts/ci/apply-elv4-p2-schema.py

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format schema sources
        working-directory: apps/mobile
        run: dart format lib/data/database/app_database.dart lib/data/database/power_database_tables.dart lib/data/repositories/drift_power_runtime_store.dart

      - name: Commit schema integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib/data/database/app_database.dart apps/mobile/lib/data/database/app_database.g.dart apps/mobile/lib/data/database/power_database_tables.dart apps/mobile/lib/data/repositories/drift_power_runtime_store.dart
          git diff --cached --quiet && exit 0
          git commit -m 'feat(elv4-p2): integrate revision-scoped power persistence'
          git push origin HEAD:feat/flutter-elv4-power-topology-design
