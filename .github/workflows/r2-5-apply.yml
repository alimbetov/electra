name: ELV2 Round2 R2.5 Apply

on:
  push:
    branches:
      - 'audit/elv2-hard-review-round-2'
    paths:
      - '.github/scripts/r2_5_apply.py'
      - '.github/workflows/r2-5-apply.yml'

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/elv2-hard-review-round-2
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply R2.5 fix
        run: python3 .github/scripts/r2_5_apply.py

      - name: Format and targeted test
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          dart format lib/application/engineering_reference_revision_preview.dart test/application/engineering_reference_revision_preview_round2_test.dart
          flutter test test/application/engineering_reference_revision_preview_round2_test.dart test/application/engineering_reference_revision_preview_test.dart

      - name: Remove temporary patcher
        run: git rm .github/scripts/r2_5_apply.py .github/workflows/r2-5-apply.yml

      - name: Commit remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(elv2): expose internal mapping revision impact'
          git push origin HEAD:audit/elv2-hard-review-round-2
