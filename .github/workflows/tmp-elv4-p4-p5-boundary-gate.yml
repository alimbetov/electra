name: Temporary ELV4 P4 P5 Boundary Gate

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - .github/workflows/tmp-elv4-p4-p5-boundary-gate.yml
      - packages/engineering_core/lib/engineering_core.dart
      - packages/engineering_core/lib/src/power_bottom_up_evaluation.dart
      - packages/engineering_core/lib/src/power_load_evaluation.dart
      - packages/engineering_core/lib/src/power_dc_backup.dart
      - packages/engineering_core/test/power_bottom_up_evaluation_test.dart

permissions:
  contents: write

jobs:
  core-boundary:
    if: github.ref_name == 'feat/flutter-elv4-power-topology-design'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install engineering core dependencies
        working-directory: packages/engineering_core
        run: dart pub get
      - name: Format boundary slice
        run: |
          dart format \
            packages/engineering_core/lib/engineering_core.dart \
            packages/engineering_core/lib/src/power_bottom_up_evaluation.dart \
            packages/engineering_core/lib/src/power_load_evaluation.dart \
            packages/engineering_core/lib/src/power_dc_backup.dart \
            packages/engineering_core/test/power_bottom_up_evaluation_test.dart
      - name: Analyze engineering core
        working-directory: packages/engineering_core
        run: dart analyze
      - name: Test P4-T08 P5 P6 boundary
        working-directory: packages/engineering_core
        run: dart test test/power_bottom_up_evaluation_test.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/engineering_core/lib/engineering_core.dart \
            packages/engineering_core/lib/src/power_bottom_up_evaluation.dart \
            packages/engineering_core/lib/src/power_load_evaluation.dart \
            packages/engineering_core/lib/src/power_dc_backup.dart \
            packages/engineering_core/test/power_bottom_up_evaluation_test.dart
          git commit -m "style(elv4): format P4 P5 boundary slice"
          git push origin HEAD:${{ github.ref_name }}
