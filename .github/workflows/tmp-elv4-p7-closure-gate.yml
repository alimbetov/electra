name: Temporary ELV4 P7 Closure Gate

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - .github/workflows/tmp-elv4-p7-closure-gate.yml
      - apps/mobile/lib/data/database/drift_raw_statement.dart
      - apps/mobile/lib/data/repositories/drift_power_runtime_store.dart
      - apps/mobile/lib/data/repositories/drift_power_publication_runtime.dart
      - apps/mobile/lib/data/repositories/drift_power_batch_publication_runtime.dart
      - apps/mobile/lib/data/repositories/drift_elv_design_revision_repository.dart
      - apps/mobile/lib/application/power_workspace_state.dart
      - apps/mobile/test/data/elv4_p7_runtime_test.dart
      - apps/mobile/test/data/elv4_p7_batch_runtime_test.dart
      - apps/mobile/test/data/elv4_p7_freeze_integration_test.dart
      - apps/mobile/test/application/power_workspace_state_test.dart
      - apps/mobile/test/data/elv4_p2_persistence_test.dart

permissions:
  contents: read

jobs:
  p7-closure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install mobile dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate Drift code
        run: dart run build_runner build
      - name: Verify P7 closure formatting
        working-directory: .
        run: |
          dart format --output=none --set-exit-if-changed \
            apps/mobile/lib/data/database/drift_raw_statement.dart \
            apps/mobile/lib/data/repositories/drift_power_runtime_store.dart \
            apps/mobile/lib/data/repositories/drift_power_publication_runtime.dart \
            apps/mobile/lib/data/repositories/drift_power_batch_publication_runtime.dart \
            apps/mobile/lib/data/repositories/drift_elv_design_revision_repository.dart \
            apps/mobile/lib/application/power_workspace_state.dart \
            apps/mobile/test/data/elv4_p2_persistence_test.dart \
            apps/mobile/test/data/elv4_p7_runtime_test.dart \
            apps/mobile/test/data/elv4_p7_batch_runtime_test.dart \
            apps/mobile/test/data/elv4_p7_freeze_integration_test.dart \
            apps/mobile/test/application/power_workspace_state_test.dart
      - name: Analyze mobile app
        run: flutter analyze
      - name: Test P7 closure and P2/P3 persistence regression
        run: |
          flutter test \
            test/data/elv4_p7_runtime_test.dart \
            test/data/elv4_p7_batch_runtime_test.dart \
            test/data/elv4_p7_freeze_integration_test.dart \
            test/application/power_workspace_state_test.dart \
            test/data/elv4_p2_persistence_test.dart \
            test/data/elv_p3_runtime_closure_test.dart
