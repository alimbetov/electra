name: ELV4 P7 Closure Gate

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - .github/workflows/tmp-elv4-p7-closure-gate.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze mobile
        working-directory: apps/mobile
        run: flutter analyze
      - name: Run P7 closure acceptance
        working-directory: apps/mobile
        run: |
          flutter test \
            test/application/power_workspace_state_test.dart \
            test/application/power_workspace_controller_test.dart \
            test/features/editor/power_workspace_panel_test.dart \
            test/data/elv4_p7_runtime_test.dart \
            test/data/elv4_p7_batch_runtime_test.dart \
            test/data/elv4_p7_freeze_integration_test.dart \
            test/data/elv4_p7_t06_history_test.dart
