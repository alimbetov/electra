name: Temporary ELV3 Analyze Diagnostics

on:
  push:
    branches:
      - feat/elv3-runtime-closure
    paths:
      - '.github/workflows/tmp-elv3-analyze-diagnostics.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/elv3-runtime-closure

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        working-directory: apps/mobile
        run: dart run build_runner build

      - name: Capture analyze output
        working-directory: apps/mobile
        shell: bash
        run: |
          set +e
          flutter analyze > analyze.log 2>&1
          status=$?
          cat analyze.log
          exit 0

      - name: Upload analyzer log
        uses: actions/upload-artifact@v4
        with:
          name: elv3-analyze-log
          path: apps/mobile/analyze.log
