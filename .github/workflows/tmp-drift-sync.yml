name: Temporary Drift Sync

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - apps/mobile/lib/data/database/app_database.dart

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Regenerate Drift
        working-directory: apps/mobile
        run: dart run build_runner build
      - name: Commit generated Drift output
        run: |
          git add apps/mobile/lib/data/database/app_database.g.dart
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(drift): regenerate database reference metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
