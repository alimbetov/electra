name: Temporary Drift Sync

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - .github/workflows/tmp-drift-sync.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fix Drift foreign-key source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/lib/data/database/app_database.dart')
          source = path.read_text()
          old = 'text().references(ComponentInstances, #componentInstanceId)();'
          new = 'text().references(ComponentInstances, #id)();'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale Drift FK reference, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Regenerate Drift
        working-directory: apps/mobile
        run: dart run build_runner build
      - name: Commit source and generated Drift output
        run: |
          git add apps/mobile/lib/data/database/app_database.dart \
                  apps/mobile/lib/data/database/app_database.g.dart
          if git diff --cached --quiet; then
            echo "No Drift changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(drift): reference component instance primary key"
          git push origin "HEAD:${GITHUB_REF_NAME}"
