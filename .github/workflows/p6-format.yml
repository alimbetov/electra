name: P6 Format

on:
  push:
    branches:
      - feat/flutter-elv2-profile-constraints
    paths:
      - '.github/workflows/p6-format.yml'

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv2-profile-constraints
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Reproduce mobile CI formatting
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          dart format lib/application/engineering_reference_adoption.dart test/application/engineering_reference_adoption_test.dart
      - name: Commit formatter output and remove helper
        run: |
          rm .github/workflows/p6-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib/application/engineering_reference_adoption.dart apps/mobile/test/application/engineering_reference_adoption_test.dart .github/workflows/p6-format.yml
          git commit -m 'style(elv2): format P6 adoption planner'
          git push origin HEAD:feat/flutter-elv2-profile-constraints
