name: ELV4 P8 Rejection Race Gate

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - .github/workflows/tmp-elv4-p8-rejection-race-gate.yml
      - apps/mobile/test/data/elv4_p8_rejection_concurrency_acceptance_test.dart

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Normalize rejection race fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/test/data/elv4_p8_rejection_concurrency_acceptance_test.dart')
          text = p.read_text()
          bad = '''    final ledger = await dbA.customSelect(\n      'SELECT outcome_kind FROM command_execution_records '\n      'WHERE project_id = ? AND command_id = ?',\n      variables: [],\n    ).get();\n    // customSelect positional variables are intentionally avoided here because\n    // the fixed fixture identifiers are safe constants in this acceptance.\n'''
          if bad in text:
              text = text.replace(bad, '', 1)
          text = text.replace('    expect(ledger.length, greaterThanOrEqualTo(1));\n', '')
          p.write_text(text)
          PY
      - name: Format rejection race acceptance
        working-directory: apps/mobile
        run: dart format test/data/elv4_p8_rejection_concurrency_acceptance_test.dart
      - name: Analyze mobile
        working-directory: apps/mobile
        run: flutter analyze
      - name: Run rejection concurrency acceptance
        working-directory: apps/mobile
        run: |
          flutter test \
            test/data/elv4_p8_rejection_concurrency_acceptance_test.dart \
            test/data/elv4_p8_public_vertical_acceptance_test.dart \
            test/data/elv4_p8_command_outcome_durability_test.dart \
            test/data/elv4_p8_idempotency_race_acceptance_test.dart \
            test/data/elv4_p8_failure_race_acceptance_test.dart
      - name: Commit verified acceptance
        run: |
          if git diff --quiet -- apps/mobile/test/data/elv4_p8_rejection_concurrency_acceptance_test.dart; then
            echo 'Rejection race acceptance already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/test/data/elv4_p8_rejection_concurrency_acceptance_test.dart
          git commit -m 'test(elv4): normalize P8 rejection concurrency acceptance'
          git push origin HEAD:feat/flutter-elv4-power-topology-design
