name: ELV2 Core Format Diagnostic

on:
  push:
    branches:
      - feat/flutter-elv2-profile-constraints

jobs:
  format-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install core dependencies
        working-directory: packages/engineering_core
        run: dart pub get
      - name: Format core P1 files
        working-directory: packages/engineering_core
        run: |
          dart format \
            lib/src/engineering_reference_catalog.dart \
            lib/src/engineering_reference_constraints.dart \
            lib/src/engineering_reference_revision.dart \
            test/engineering_reference_catalog_test.dart \
            test/engineering_reference_constraints_test.dart
      - name: Upload formatted core files
        uses: actions/upload-artifact@v4
        with:
          name: elv2-formatted-core-ci-context
          path: |
            packages/engineering_core/lib/src/engineering_reference_catalog.dart
            packages/engineering_core/lib/src/engineering_reference_constraints.dart
            packages/engineering_core/lib/src/engineering_reference_revision.dart
            packages/engineering_core/test/engineering_reference_catalog_test.dart
            packages/engineering_core/test/engineering_reference_constraints_test.dart
