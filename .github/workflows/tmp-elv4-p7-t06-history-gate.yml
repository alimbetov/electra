name: Temporary ELV4 P7 T06 History Gate

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - .github/workflows/tmp-elv4-p7-t06-history-gate.yml
      - scripts/ci/apply-elv4-p7-history-schema.py
      - scripts/ci/apply-elv4-p7-history-replay.py
      - scripts/ci/apply-elv4-p7-history-integrity.py
      - scripts/ci/apply-elv4-p7-history-acceptance.py
      - scripts/ci/fix-elv4-p7-history-acceptance-scope.py
      - scripts/ci/apply-elv4-p7-t06-wiring.py
      - apps/mobile/lib/data/database/elv_history_database_tables.dart
      - apps/mobile/lib/data/repositories/drift_elv_reviewed_routing_runtime.dart
      - apps/mobile/lib/application/elv_reviewed_reroute_command.dart
      - apps/mobile/lib/application/elv_revision_command_history.dart
      - apps/mobile/lib/application/elv_revision_command_history_service.dart
      - apps/mobile/lib/application/elv_reviewed_workspace_command.dart
      - apps/mobile/lib/application/power_workspace_controller.dart
      - apps/mobile/lib/application/elv_physical_routing_workspace_service.dart
      - apps/mobile/lib/features/editor/power_workspace_editor_binding.dart
      - apps/mobile/lib/features/editor/power_workspace_panel_host.dart
      - apps/mobile/test/application/power_workspace_controller_test.dart
      - apps/mobile/test/application/elv_reviewed_reroute_command_test.dart
      - apps/mobile/test/data/elv4_p7_t06_history_test.dart

permissions:
  contents: write

jobs:
  p7-t06-history:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install mobile dependencies
        run: flutter pub get --enforce-lockfile
      - name: Apply revision history schema
        working-directory: .
        run: python scripts/ci/apply-elv4-p7-history-schema.py
      - name: Apply RM08 lost-response replay
        working-directory: .
        run: python scripts/ci/apply-elv4-p7-history-replay.py
      - name: Apply RM08 database integrity
        working-directory: .
        run: python scripts/ci/apply-elv4-p7-history-integrity.py
      - name: Apply P7 T06 negative acceptance
        working-directory: .
        run: python scripts/ci/apply-elv4-p7-history-acceptance.py
      - name: Normalize P7 T06 acceptance scope
        working-directory: .
        run: python scripts/ci/fix-elv4-p7-history-acceptance-scope.py
      - name: Apply P7 T06 production wiring
        working-directory: .
        run: python scripts/ci/apply-elv4-p7-t06-wiring.py
      - name: Generate Drift code
        run: dart run build_runner build
      - name: Format P7 T06 slice
        working-directory: .
        run: |
          dart format \
            apps/mobile/lib/data/database/app_database.dart \
            apps/mobile/lib/data/database/elv_history_database_tables.dart \
            apps/mobile/lib/data/repositories/drift_elv_reviewed_routing_runtime.dart \
            apps/mobile/lib/application/elv_reviewed_reroute_command.dart \
            apps/mobile/lib/application/elv_revision_command_history.dart \
            apps/mobile/lib/application/elv_revision_command_history_service.dart \
            apps/mobile/lib/application/elv_reviewed_workspace_command.dart \
            apps/mobile/lib/application/power_workspace_controller.dart \
            apps/mobile/lib/application/elv_physical_routing_workspace_service.dart \
            apps/mobile/lib/features/editor/power_workspace_editor_binding.dart \
            apps/mobile/lib/features/editor/power_workspace_panel_host.dart \
            apps/mobile/lib/features/editor/persisted_room_editor_screen.dart \
            apps/mobile/lib/app/providers.dart \
            apps/mobile/test/application/power_workspace_controller_test.dart \
            apps/mobile/test/application/elv_reviewed_reroute_command_test.dart \
            apps/mobile/test/data/elv4_p7_t06_history_test.dart
      - name: Analyze mobile app
        run: flutter analyze
      - name: Test P7 T06 application and UI regressions
        run: |
          flutter test \
            test/application/power_workspace_controller_test.dart \
            test/application/elv_reviewed_reroute_command_test.dart \
            test/features/editor/power_workspace_panel_test.dart \
            test/features/editor/room_editor_screen_test.dart \
            test/features/editor/editor_interaction_test.dart \
            test/data/elv4_p7_runtime_test.dart \
            test/data/elv4_p7_t06_history_test.dart
      - name: Commit P7 T06 schema and wiring
        working-directory: .
        run: |
          if git diff --quiet -- \
            apps/mobile/lib/data/database/app_database.dart \
            apps/mobile/lib/data/database/elv_history_database_tables.dart \
            apps/mobile/lib/data/repositories/drift_elv_reviewed_routing_runtime.dart \
            apps/mobile/lib/application/elv_reviewed_reroute_command.dart \
            apps/mobile/lib/application/elv_revision_command_history.dart \
            apps/mobile/lib/application/power_workspace_controller.dart \
            apps/mobile/lib/application/elv_physical_routing_workspace_service.dart \
            apps/mobile/lib/features/editor/power_workspace_editor_binding.dart \
            apps/mobile/lib/features/editor/power_workspace_panel_host.dart \
            apps/mobile/lib/features/editor/persisted_room_editor_screen.dart \
            apps/mobile/lib/app/providers.dart \
            apps/mobile/test/application/power_workspace_controller_test.dart \
            apps/mobile/test/application/elv_reviewed_reroute_command_test.dart \
            apps/mobile/test/data/elv4_p7_t06_history_test.dart; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/mobile/lib/data/database/app_database.dart \
            apps/mobile/lib/data/database/elv_history_database_tables.dart \
            apps/mobile/lib/data/repositories/drift_elv_reviewed_routing_runtime.dart \
            apps/mobile/lib/application/elv_reviewed_reroute_command.dart \
            apps/mobile/lib/application/elv_revision_command_history.dart \
            apps/mobile/lib/application/power_workspace_controller.dart \
            apps/mobile/lib/application/elv_physical_routing_workspace_service.dart \
            apps/mobile/lib/features/editor/power_workspace_editor_binding.dart \
            apps/mobile/lib/features/editor/power_workspace_panel_host.dart \
            apps/mobile/lib/features/editor/persisted_room_editor_screen.dart \
            apps/mobile/lib/app/providers.dart \
            apps/mobile/test/application/power_workspace_controller_test.dart \
            apps/mobile/test/application/elv_reviewed_reroute_command_test.dart \
            apps/mobile/test/data/elv4_p7_t06_history_test.dart
          git commit -m "test(elv4): close P7 T06 history edge cases"
          git reset --hard HEAD
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
