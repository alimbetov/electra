name: ELV2 Round2 R2.1 Apply

on:
  push:
    branches:
      - 'audit/elv2-hard-review-round-2'
    paths:
      - '.github/scripts/r2_1_apply.py'
      - '.github/workflows/r2-1-apply.yml'

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/elv2-hard-review-round-2
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Apply R2.1 fix
        run: python3 .github/scripts/r2_1_apply.py

      - name: Format and targeted test
        working-directory: packages/engineering_core
        run: |
          dart pub get
          dart format lib/src/engineering_reference_catalog.dart test/engineering_reference_identity_round2_test.dart
          dart test test/engineering_reference_identity_round2_test.dart

      - name: Remove temporary patcher
        run: git rm .github/scripts/r2_1_apply.py .github/workflows/r2-1-apply.yml

      - name: Commit remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(elv2): canonicalize profile identity semantics'
          git push origin HEAD:audit/elv2-hard-review-round-2
