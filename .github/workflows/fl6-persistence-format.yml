name: Normalize FL6 Persistence

on:
  push:
    branches:
      - feat/flutter-geometry-kernel

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-geometry-kernel
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - working-directory: apps/mobile
        run: dart format lib/data/database/app_database.dart lib/data/repositories/drift_component_instance_repository.dart
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/data/database/app_database.dart apps/mobile/lib/data/repositories/drift_component_instance_repository.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: normalize FL6 persistence"
          git push origin HEAD:feat/flutter-geometry-kernel
