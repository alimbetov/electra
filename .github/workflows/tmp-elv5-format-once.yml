name: Temporary ELV5 Format Once

on:
  push:
    branches:
      - feat/flutter-elv5-power-topology-design
    paths:
      - '.github/workflows/tmp-elv5-format-once.yml'

permissions:
  contents: write

jobs:
  format-once:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv5-power-topology-design
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply Dart formatter
        run: dart format lib test
      - name: Remove one-shot workflow and commit
        working-directory: .
        run: |
          rm -f .github/workflows/tmp-elv5-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib apps/mobile/test .github/workflows/tmp-elv5-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(elv5): apply Dart formatter"
          git push origin HEAD:feat/flutter-elv5-power-topology-design
