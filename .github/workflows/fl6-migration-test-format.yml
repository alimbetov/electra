name: Normalize FL6 Migration Test

on:
  push:
    branches:
      - feat/flutter-geometry-kernel

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-geometry-kernel
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - working-directory: apps/mobile
        run: dart format test/data/component_instance_persistence_test.dart
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/test/data/component_instance_persistence_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: normalize FL6 migration test"
          git push origin HEAD:feat/flutter-geometry-kernel
