name: Temporary ELV3 Formatter

on:
  push:
    branches:
      - feat/elv3-runtime-closure
    paths:
      - '.github/workflows/tmp-elv3-format.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/elv3-runtime-closure
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile

      - name: Format mobile
        working-directory: apps/mobile
        run: dart format lib test

      - name: Install engineering core dependencies
        working-directory: packages/engineering_core
        run: dart pub get

      - name: Format engineering core
        working-directory: packages/engineering_core
        run: dart format lib test

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib apps/mobile/test packages/engineering_core/lib packages/engineering_core/test
          git diff --cached --quiet && exit 0
          git commit -m 'style(elv3): normalize runtime closure formatting'
          git pull --rebase origin feat/elv3-runtime-closure
          git push origin HEAD:feat/elv3-runtime-closure
