name: Temporary ELV4 Core Format Fix

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - '.github/workflows/tmp-elv4-core-format-fix.yml'

permissions:
  contents: write

jobs:
  normalize-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design

      - name: Repair unique cycle witness contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('packages/engineering_core/lib/src/power_graph.dart')
          text = source.read_text()
          old = "witness = [...stack.sublist(start), next];"
          new = "witness = stack.sublist(start);"
          if text.count(old) != 1:
              raise SystemExit('Expected cycle witness construction not found exactly once')
          source.write_text(text.replace(old, new, 1))

          test = Path('packages/engineering_core/test/power_graph_test.dart')
          text = test.read_text()
          old = """      expect(\n        validation.findings.map((finding) => finding.code),\n        contains('ELV4_POWER_GRAPH_ACTIVE_CYCLE'),\n      );\n"""
          new = """      expect(\n        validation.findings.map((finding) => finding.code),\n        contains('ELV4_POWER_GRAPH_ACTIVE_CYCLE'),\n      );\n      expect(\n        validation.findings\n            .singleWhere(\n              (finding) => finding.code == 'ELV4_POWER_GRAPH_ACTIVE_CYCLE',\n            )\n            .witnesses,\n        ['source'],\n      );\n"""
          if text.count(old) != 1:
              raise SystemExit('Expected self-loop assertion block not found exactly once')
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install engineering core dependencies
        working-directory: packages/engineering_core
        run: dart pub get

      - name: Format engineering core
        working-directory: packages/engineering_core
        run: dart format lib test

      - name: Analyze engineering core
        working-directory: packages/engineering_core
        run: dart analyze

      - name: Test engineering core
        working-directory: packages/engineering_core
        run: dart test

      - name: Commit verified core repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/engineering_core/lib packages/engineering_core/test
          git diff --cached --quiet && { echo 'No engineering core changes required.'; exit 1; }
          git commit -m 'fix(elv4): keep cycle witnesses unique and normalize core formatting'
          git push origin HEAD:feat/flutter-elv4-power-topology-design
