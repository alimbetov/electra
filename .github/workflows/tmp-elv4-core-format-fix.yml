name: Temporary ELV4 Core Format Fix

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - '.github/workflows/tmp-elv4-core-format-fix.yml'

permissions:
  contents: write

jobs:
  normalize-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install engineering core dependencies
        working-directory: packages/engineering_core
        run: dart pub get

      - name: Format engineering core
        working-directory: packages/engineering_core
        run: dart format lib test

      - name: Analyze engineering core
        working-directory: packages/engineering_core
        run: dart analyze

      - name: Test engineering core
        working-directory: packages/engineering_core
        run: dart test

      - name: Commit verified formatter diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/engineering_core/lib packages/engineering_core/test
          git diff --cached --quiet && { echo 'No engineering core formatting changes required.'; exit 1; }
          git commit -m 'style(elv4): normalize engineering core formatting'
          git push origin HEAD:feat/flutter-elv4-power-topology-design
