name: Flutter Local Foundation

on:
  push:
    branches:
      - main
      - 'feat/flutter-*'
      - 'feat/elv3-*'
      - 'audit/elv2-*'
    paths-ignore:
      - '.github/workflows/tmp-*.yml'
      - 'scripts/ci/apply-elv3-runtime-rc*.py'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/engineering_core/**'
      - 'docs/product/**'
      - 'docs/audit/**'
      - 'scripts/**'
      - '.gitignore'
      - '.github/workflows/**'

jobs:
  flutter-local:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked generated artifacts
        working-directory: .
        run: bash scripts/ci/check-no-generated-artifacts.sh

      - name: Verify ELV3 P7-P9 foundation contract
        working-directory: .
        run: bash scripts/ci/check-elv3-p7-p9-foundation.sh

      - name: Verify ELV5 process specification
        working-directory: .
        run: python3 scripts/ci/check-elv5-specification.py

      - name: Verify ELV5 command registry
        working-directory: .
        run: python3 scripts/ci/check-elv5-command-registry.py

      - name: Verify ELV5 canonical command examples
        working-directory: .
        run: python3 scripts/ci/check-elv5-command-examples.py

      - name: Verify ELV6 process and 80-requirement specification
        working-directory: .
        run: python3 scripts/ci/check-elv6-specification.py

      - name: Verify ELV6 safety standards readiness
        working-directory: .
        run: python3 scripts/ci/check-elv6-safety-readiness.py

      - name: Verify ELV6 exact command registry
        working-directory: .
        run: python3 scripts/ci/check-elv6-command-registry.py

      - name: Verify ELV6 command examples and qualification manifest
        working-directory: .
        run: python3 scripts/ci/check-elv6-qualification-design.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install mobile dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Verify mobile formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze mobile app
        run: flutter analyze

      - name: Test mobile app
        run: flutter test

      - name: Install engineering core dependencies
        working-directory: packages/engineering_core
        run: dart pub get

      - name: Verify engineering core formatting
        working-directory: packages/engineering_core
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze engineering core
        working-directory: packages/engineering_core
        run: dart analyze

      - name: Test engineering core
        working-directory: packages/engineering_core
        run: dart test
