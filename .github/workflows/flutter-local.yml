name: Flutter Local Foundation

on:
  push:
    branches:
      - 'feat/flutter-*'

permissions:
  contents: write

jobs:
  reconcile-elv4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Normalize final closure wording
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/product/elv4-implementation/closure.json')
          data = json.loads(path.read_text())
          for deviation in data.get('architectureDeviations', []):
              if deviation.get('area') == 'RM01 result ownership':
                  deviation['disposition'] = (
                      'Recorded deviation from planned shared ProjectDerivedResults owner/kind extension; '
                      'dedicated power evaluation ownership and invalidation are verified by the resolved '
                      'C01-C05 implementation evidence and final exact-head acceptance gate.'
                  )
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          python3 scripts/ci/check-elv4-closure.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/product/elv4-implementation/closure.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(elv4): normalize final closure wording"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
