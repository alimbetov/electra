name: Flutter Local Foundation

on:
  push:
    branches:
      - main
      - 'feat/flutter-*'
      - 'feat/elv3-*'
      - 'audit/elv2-*'
    paths-ignore:
      - '.github/workflows/tmp-*.yml'
      - 'scripts/ci/apply-elv3-runtime-rc*.py'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/engineering_core/**'
      - 'docs/product/**'
      - 'docs/audit/**'
      - 'scripts/**'
      - '.gitignore'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  flutter-local:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Remove unused Drift import
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/data/elv4_p9_runtime_qualification_test.dart')
          text = path.read_text()
          line = "import 'package:drift/drift.dart' hide isNotNull;\n"
          if line in text:
              path.write_text(text.replace(line, '', 1))
          PY
          if ! git diff --quiet -- test/data/elv4_p9_runtime_qualification_test.dart; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add test/data/elv4_p9_runtime_qualification_test.dart
            git commit -m "fix(elv4): remove unused qualification Drift import"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Reject tracked generated artifacts
        working-directory: .
        run: bash scripts/ci/check-no-generated-artifacts.sh

      - name: Verify ELV3 P7-P9 foundation contract
        working-directory: .
        run: bash scripts/ci/check-elv3-p7-p9-foundation.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install mobile dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Verify mobile formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze mobile app
        run: flutter analyze

      - name: Test mobile app
        run: flutter test

      - name: Install engineering core dependencies
        working-directory: packages/engineering_core
        run: dart pub get

      - name: Verify engineering core formatting
        working-directory: packages/engineering_core
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze engineering core
        working-directory: packages/engineering_core
        run: dart analyze

      - name: Test engineering core
        working-directory: packages/engineering_core
        run: dart test
