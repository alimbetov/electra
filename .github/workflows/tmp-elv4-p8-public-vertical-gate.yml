name: ELV4 P8 Public Vertical Gate

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - .github/workflows/tmp-elv4-p8-public-vertical-gate.yml
      - apps/mobile/test/support/elv4_power_qualification_builder.dart
      - apps/mobile/test/support/elv4_power_qualification_topology.dart
      - apps/mobile/test/data/elv4_p8_public_vertical_acceptance_test.dart

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Align qualification fixtures with runtime APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          builder = Path('apps/mobile/test/support/elv4_power_qualification_builder.dart')
          text = builder.read_text()
          text = text.replace(
              "      frequencyHz: currentKind == PowerCurrentKind.ac\n          ? PowerRational.integer(50)\n          : null,",
              "      frequencyMinHz: currentKind == PowerCurrentKind.ac\n          ? PowerRational.integer(50)\n          : null,\n      frequencyMaxHz: currentKind == PowerCurrentKind.ac\n          ? PowerRational.integer(50)\n          : null,",
          )
          text = text.replace(
              'PowerRational.fromFraction(9, 10)',
              'PowerRational(BigInt.from(9), BigInt.from(10))',
          )
          builder.write_text(text)

          topology = Path('apps/mobile/test/support/elv4_power_qualification_topology.dart')
          text = topology.read_text()
          needle = """    final systemId = await ensureSystem(familyCode);\n    final profileId = '$projectId-profile-${familyCode.toLowerCase()}';\n"""
          replacement = """    final systemId = await ensureSystem(familyCode);\n    final systems = DriftEngineeringSystemRepository(\n      database,\n      originDeviceId: 'qualification',\n    );\n    final snapshot = await topology.load(projectId);\n    final fromPort = snapshot.ports.singleWhere((port) => port.id == fromPortId);\n    final toPort = snapshot.ports.singleWhere((port) => port.id == toPortId);\n    await systems.assign(\n      projectId,\n      ComponentSystemMembership(\n        systemId: systemId,\n        componentId: fromPort.componentId,\n        role: 'DEVICE',\n      ),\n    );\n    await systems.assign(\n      projectId,\n      ComponentSystemMembership(\n        systemId: systemId,\n        componentId: toPort.componentId,\n        role: 'DEVICE',\n      ),\n    );\n    final profileId = '$projectId-profile-${familyCode.toLowerCase()}';\n"""
          if needle in text:
              text = text.replace(needle, replacement, 1)
          topology.write_text(text)

          test = Path('apps/mobile/test/data/elv4_p8_public_vertical_acceptance_test.dart')
          text = test.read_text()
          command_import = "import 'package:electra_mobile/data/repositories/drift_power_command_service.dart';\n"
          publication_import = "import 'package:electra_mobile/data/repositories/drift_power_publication_runtime.dart';\n"
          if 'drift_power_publication_runtime.dart' not in text:
              text = text.replace(command_import, command_import + publication_import)
          text = text.replace(command_import, '')
          text = text.replace(
              "import 'package:electra_mobile/data/repositories/drift_elv_design_revision_repository.dart';\n",
              '',
          )
          text = text.replace(
              "      final powerView = await reopened.readPowerRevision(\n        builder.projectId,\n        builder.revisionId,\n      );",
              "      final powerView = await DriftPowerPublicationRuntime(\n        db,\n        originDeviceId: 'qualification',\n      ).readRevision(\n        projectId: builder.projectId,\n        designRevisionId: builder.revisionId,\n      );",
          )
          text = text.replace(
              "      final reopened = DriftElvDesignRevisionRepository(\n        db,\n        originDeviceId: 'qualification',\n      );\n",
              '',
          )
          text = text.replace(
              'PowerRational.fromFraction(4, 5)',
              'PowerRational(BigInt.from(4), BigInt.from(5))',
          )
          text = text.replace(
              'PowerRational.fromFraction(1, 5)',
              'PowerRational(BigInt.one, BigInt.from(5))',
          )
          call_anchor = """      final frozen = await builder.revisions.freeze(\n"""
          call = """      await _publishVerticalEvidence(builder, db);\n      expect(\n        await _countWhere(\n          db,\n          'power_evaluation_pointers',\n          \"state = 'CURRENT'\",\n        ),\n        4,\n      );\n\n      final frozen = await builder.revisions.freeze(\n"""
          if '_publishVerticalEvidence(builder, db)' not in text:
              text = text.replace(call_anchor, call, 1)
          helper = r'''

Future<void> _publishVerticalEvidence(
  Elv4QualificationBuilder builder,
  AppDatabase db,
) async {
  final runtime = DriftPowerPublicationRuntime(
    db,
    originDeviceId: 'qualification',
    now: () => DateTime.utc(2026, 10, 15, 21, 15),
  );
  final cases = <(String, String, String, String)>[
    ('CCTV', 'NORMAL', 'cctv-camera', 'LOAD-CCTV_CAMERA_LOAD'),
    ('LAN', 'NORMAL', 'lan-pd', 'LOAD-LAN_PD_LOAD'),
    ('ACS', 'ACS_BACKUP', 'acs-controller', 'SCENARIO-ACS-BACKUP'),
    ('FIRE', 'FIRE_SEQUENCE', 'fire-panel', 'SCENARIO-FIRE-SEQUENCE'),
  ];
  for (final item in cases) {
    final node = PowerNodeKeyV2(
      revisionId: builder.revisionId,
      scenarioId: item.$2,
      scopeKind: PowerEvaluationScopeKind.segment,
      scopeId: '${item.$1}-QUALIFICATION',
      processCode: PowerProcessCode.pwr01,
      subjectKind: 'COMPONENT',
      subjectId: item.$3,
    );
    final fact = builder.dependency(item.$4, purpose: 'QUALIFICATION_INPUT');
    final input = PowerConsumedInput(
      algorithmVersion: 'elv4-p8-qualification-v1',
      inputSchemaVersion: 'electra.elv4-p8-qualification-input.v1',
      numericPolicyVersion: powerNumericPolicyVersion,
      facts: [
        PowerConsumedFact.present(
          key: fact,
          valueSchema: 'electra.elv4-p8-qualification-fact.v1',
          value: {
            'discipline': item.$1,
            'entityId': fact.entityId,
            'purpose': fact.purpose,
          },
        ),
      ],
      evaluations: const [],
    );
    final capture = await runtime.captureForCalculation(
      projectId: builder.projectId,
      designRevisionId: builder.revisionId,
      targetNodeKey: node,
      captureInput: () async => input,
    );
    final evidence = PowerEvaluationEvidence(
      evaluationId: 'P8-${item.$1}-PWR01',
      nodeKey: node,
      algorithmVersion: input.algorithmVersion,
      inputSchemaVersion: input.inputSchemaVersion,
      outputSchemaVersion: 'electra.elv4-p8-qualification-output.v1',
      numericPolicyVersion: input.numericPolicyVersion,
      inputFingerprint: input.inputFingerprint,
      status: PowerEvaluationStatus.pass,
      applicability: PowerEvaluationApplicability.applicable,
      inputs: {'dependencyKeys': input.dependencyKeys},
      output: {'qualified': true, 'discipline': item.$1},
      dependencies: const [],
    );
    final receipt = await runtime.publishGuarded(
      capture: capture,
      evidence: evidence,
      operationId: 'p8-qualify-${item.$1.toLowerCase()}',
      commandFingerprint: sha256HexUtf8('p8-qualify-${item.$1}'),
      recaptureInput: () async => input,
    );
    expect(receipt.replayed, isFalse);
  }
}
'''
          if 'Future<void> _publishVerticalEvidence(' not in text:
              text += helper
          test.write_text(text)
          PY
      - name: Format P8 public qualification
        working-directory: apps/mobile
        run: dart format test/support/elv4_power_qualification_builder.dart test/support/elv4_power_qualification_topology.dart test/data/elv4_p8_public_vertical_acceptance_test.dart
      - name: Analyze mobile
        working-directory: apps/mobile
        run: flutter analyze
      - name: Run P8 public vertical qualification
        working-directory: apps/mobile
        run: |
          flutter test \
            test/data/elv4_p2_power_command_service_test.dart \
            test/data/elv4_p8_public_vertical_acceptance_test.dart \
            test/data/elv4_p8_command_outcome_durability_test.dart \
            test/data/elv4_p8_idempotency_race_acceptance_test.dart \
            test/data/elv4_p8_failure_race_acceptance_test.dart \
            test/data/elv4_p8_freeze_historical_invariance_test.dart
      - name: Commit verified qualification
        run: |
          if git diff --quiet -- apps/mobile/test/support/elv4_power_qualification_builder.dart apps/mobile/test/support/elv4_power_qualification_topology.dart apps/mobile/test/data/elv4_p8_public_vertical_acceptance_test.dart; then
            echo 'P8 public qualification already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/test/support/elv4_power_qualification_builder.dart apps/mobile/test/support/elv4_power_qualification_topology.dart apps/mobile/test/data/elv4_p8_public_vertical_acceptance_test.dart
          git commit -m 'test(elv4): stabilize P8 public vertical qualification'
          git push origin HEAD:feat/flutter-elv4-power-topology-design
