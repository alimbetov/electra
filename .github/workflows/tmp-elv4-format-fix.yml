name: Temporary ELV4 Format Fix

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - '.github/workflows/tmp-elv4-format-fix.yml'

permissions:
  contents: write

jobs:
  format-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format mobile Dart sources
        working-directory: apps/mobile
        run: dart format lib test

      - name: Commit formatter diff
        run: |
          if git diff --quiet -- apps/mobile/lib apps/mobile/test; then
            echo 'No mobile formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib apps/mobile/test
          git commit -m 'style(elv4): normalize mobile formatting'
          git push origin HEAD:feat/flutter-elv4-power-topology-design
