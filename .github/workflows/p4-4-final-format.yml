name: P4.4 Final Format

on:
  push:
    branches:
      - 'feat/flutter-elv2-profile-constraints'

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: dart format test/data/engineering_placement_repository_test.dart
      - name: Commit formatter output
        working-directory: .
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/test/data/engineering_placement_repository_test.dart
          git diff --cached --quiet && exit 1
          git commit -m "style(elv2): stabilize P4.4 test formatting"
          git push origin HEAD:feat/flutter-elv2-profile-constraints
