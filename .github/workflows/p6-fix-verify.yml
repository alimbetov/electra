name: P6 Fix Verify

on:
  push:
    branches:
      - feat/flutter-elv2-profile-constraints
    paths:
      - '.github/workflows/p6-fix-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv2-profile-constraints
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fix P6 fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/test/data/engineering_reference_adoption_persistence_test.dart')
          s = p.read_text()
          s = s.replace("import 'package:drift/drift.dart' hide isNull, isNotNull;\n", '')
          old = """      fromPortId: binding.portIds.first,\n      toPortId: binding.portIds.last,\n    );"""
          new = """      fromPortId: binding.portIds.first,\n      toPortId: binding.portIds.last,\n      layer: ConnectionLayer.signal,\n      bidirectional: true,\n      evidence: 'P6 live dependency',\n    );"""
          if old not in s:
              raise SystemExit('expected InternalConnectivity fixture not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Generate and format
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          dart format lib/application/engineering_reference_adoption.dart lib/application/engineering_reference_adoption_repository.dart lib/application/engineering_reference_revision_preview.dart lib/data/repositories/drift_engineering_reference_adoption_repository.dart test/application/engineering_reference_adoption_test.dart test/application/engineering_reference_revision_preview_test.dart test/data/engineering_reference_adoption_persistence_test.dart
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Targeted P6 tests
        working-directory: apps/mobile
        run: flutter test test/application/engineering_reference_adoption_test.dart test/application/engineering_reference_revision_preview_test.dart test/data/engineering_reference_adoption_persistence_test.dart
      - name: Commit verified P6 tree and remove helpers
        run: |
          rm -f .github/workflows/p6-format.yml .github/workflows/p6-targeted-verify.yml .github/workflows/p6-fix-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(elv2): verify P6 atomic adoption'
          git push origin HEAD:feat/flutter-elv2-profile-constraints
