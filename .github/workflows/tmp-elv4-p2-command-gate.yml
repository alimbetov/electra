name: ELV4 P2 Command Gate

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - .github/workflows/tmp-elv4-p2-command-gate.yml
      - apps/mobile/lib/application/power_mutation_command.dart
      - apps/mobile/lib/data/repositories/drift_power_command_service.dart
      - apps/mobile/test/data/elv4_p2_power_command_service_test.dart

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Normalize SHA fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/test/data/elv4_p2_power_command_service_test.dart')
          text = p.read_text()
          text = text.replace("'a' * 64", "'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'")
          text = text.replace("'b' * 64", "'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'")
          p.write_text(text)
          PY
      - name: Format P2 command sources
        working-directory: apps/mobile
        run: dart format lib/application/power_mutation_command.dart lib/data/repositories/drift_power_command_service.dart test/data/elv4_p2_power_command_service_test.dart
      - name: Analyze mobile
        working-directory: apps/mobile
        run: flutter analyze
      - name: Run P2 command contract
        working-directory: apps/mobile
        run: flutter test test/data/elv4_p2_power_command_service_test.dart test/data/elv4_p2_persistence_test.dart test/data/elv4_p7_runtime_test.dart
      - name: Commit verified formatting
        run: |
          if git diff --quiet -- apps/mobile/lib/application/power_mutation_command.dart apps/mobile/lib/data/repositories/drift_power_command_service.dart apps/mobile/test/data/elv4_p2_power_command_service_test.dart; then
            echo 'P2 command sources already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib/application/power_mutation_command.dart apps/mobile/lib/data/repositories/drift_power_command_service.dart apps/mobile/test/data/elv4_p2_power_command_service_test.dart
          git commit -m 'style(elv4): normalize P2 power command service'
          git push origin HEAD:feat/flutter-elv4-power-topology-design
