name: Temporary ELV5 F2 Package-Aware Formatter

on:
  push:
    branches:
      - feat/flutter-elv5-power-topology-design

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies exactly as foundation CI
        run: flutter pub get --enforce-lockfile

      - name: Format mature F2 production witnesses
        run: |
          dart format \
            test/data/elv5_f2_cctv03_full_runtime_e2e_test.dart \
            test/data/elv5_f2_lan05_full_runtime_e2e_test.dart \
            test/data/elv5_f2_acs03_full_runtime_e2e_test.dart

      - name: Remove one-shot workflow and commit formatter output
        working-directory: .
        run: |
          git rm .github/workflows/tmp-elv5-f2-harness-format-package-aware.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/test/data/elv5_f2_cctv03_full_runtime_e2e_test.dart \
                  apps/mobile/test/data/elv5_f2_lan05_full_runtime_e2e_test.dart \
                  apps/mobile/test/data/elv5_f2_acs03_full_runtime_e2e_test.dart
          if git diff --quiet --cached; then
            echo 'No package-aware formatter changes produced.'
            exit 1
          fi
          git commit -m 'style(f2): align harness witnesses with package formatter'
          git push origin HEAD:feat/flutter-elv5-power-topology-design
