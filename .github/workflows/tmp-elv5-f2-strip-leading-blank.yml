name: Temporary ELV5 F2 Leading Blank Cleanup

on:
  push:
    branches:
      - feat/flutter-elv5-power-topology-design

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove exact formatter-proven leading blank lines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for raw in [
              'apps/mobile/test/data/elv5_f2_cctv03_full_runtime_e2e_test.dart',
              'apps/mobile/test/data/elv5_f2_lan05_full_runtime_e2e_test.dart',
          ]:
              path = Path(raw)
              text = path.read_text()
              if not text.startswith('\nimport '):
                  raise SystemExit(f'{path}: expected formatter-proven leading blank')
              path.write_text(text[1:])
          PY

      - name: Remove one-shot workflow and commit cleanup
        run: |
          git rm .github/workflows/tmp-elv5-f2-strip-leading-blank.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/test/data/elv5_f2_cctv03_full_runtime_e2e_test.dart \
                  apps/mobile/test/data/elv5_f2_lan05_full_runtime_e2e_test.dart
          git commit -m 'style(f2): remove leading blanks from harness witnesses'
          git push origin HEAD:feat/flutter-elv5-power-topology-design
