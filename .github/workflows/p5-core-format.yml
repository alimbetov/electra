name: P5 Core Format

on:
  push:
    branches:
      - 'feat/flutter-elv2-profile-constraints'

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format core revision model
        working-directory: packages/engineering_core
        run: dart format lib/src/engineering_reference_revision.dart
      - name: Commit formatter output and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/p5-core-format.yml
          git add packages/engineering_core/lib/src/engineering_reference_revision.dart
          git commit -m "style(elv2): format P5 core revision model"
          git push origin HEAD:feat/flutter-elv2-profile-constraints
