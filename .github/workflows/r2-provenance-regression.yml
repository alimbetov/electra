name: ELV2 Round2 Provenance Regression

on:
  push:
    branches:
      - 'audit/elv2-hard-review-round-2'
    paths:
      - 'apps/mobile/test/data/engineering_reference_adoption_provenance_round2_test.dart'
      - '.github/workflows/r2-provenance-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run regression against current semantics
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          dart format test/data/engineering_reference_adoption_provenance_round2_test.dart
          flutter test test/data/engineering_reference_adoption_provenance_round2_test.dart
