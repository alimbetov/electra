name: Normalize FL5 Core Formatting

on:
  push:
    branches:
      - feat/flutter-geometry-kernel

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-geometry-kernel
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: packages/engineering_core
        run: dart pub get
      - working-directory: packages/engineering_core
        run: dart format lib/src/surface_navigation.dart test/surface_navigation_test.dart
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/engineering_core/lib/src/surface_navigation.dart packages/engineering_core/test/surface_navigation_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: normalize FL5 core"
          git push origin HEAD:feat/flutter-geometry-kernel
