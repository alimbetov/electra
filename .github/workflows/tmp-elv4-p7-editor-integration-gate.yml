name: Temporary ELV4 P7 Editor Integration Gate

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - .github/workflows/tmp-elv4-p7-editor-integration-gate.yml
      - scripts/ci/apply-elv4-p7-editor-integration.py
      - scripts/ci/apply-elv4-p7-ui-contract-normalization.py
      - apps/mobile/lib/features/editor/room_editor_screen.dart
      - apps/mobile/lib/features/editor/persisted_room_editor_screen.dart
      - apps/mobile/lib/features/editor/power_workspace_panel.dart
      - apps/mobile/lib/features/editor/power_workspace_panel_host.dart
      - apps/mobile/lib/features/editor/power_workspace_overlay_painter.dart
      - apps/mobile/lib/features/editor/power_workspace_editor_binding.dart
      - apps/mobile/lib/application/power_workspace_overlay_geometry.dart
      - apps/mobile/test/features/editor/room_editor_screen_test.dart

permissions:
  contents: write

jobs:
  p7-editor-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install mobile dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate Drift code
        run: dart run build_runner build
      - name: Apply P7 editor integration
        working-directory: .
        run: python scripts/ci/apply-elv4-p7-editor-integration.py
      - name: Normalize compact P7 controls
        working-directory: .
        run: python scripts/ci/apply-elv4-p7-ui-contract-normalization.py
      - name: Format P7 editor integration
        working-directory: .
        run: |
          dart format \
            apps/mobile/lib/features/editor/room_editor_screen.dart \
            apps/mobile/lib/features/editor/persisted_room_editor_screen.dart \
            apps/mobile/lib/features/editor/power_workspace_panel.dart \
            apps/mobile/lib/features/editor/power_workspace_panel_host.dart \
            apps/mobile/lib/features/editor/power_workspace_overlay_painter.dart \
            apps/mobile/lib/features/editor/power_workspace_editor_binding.dart \
            apps/mobile/lib/application/power_workspace_overlay_geometry.dart
      - name: Analyze mobile app
        run: flutter analyze
      - name: Test P7 editor integration regressions
        run: |
          flutter test \
            test/features/editor/room_editor_screen_test.dart \
            test/features/editor/power_workspace_panel_test.dart \
            test/features/editor/editor_interaction_test.dart \
            test/application/power_workspace_controller_test.dart
      - name: Commit P7 editor integration
        working-directory: .
        run: |
          if git diff --quiet -- \
            apps/mobile/lib/features/editor/room_editor_screen.dart \
            apps/mobile/lib/features/editor/persisted_room_editor_screen.dart \
            apps/mobile/lib/features/editor/power_workspace_panel.dart \
            apps/mobile/lib/features/editor/power_workspace_panel_host.dart \
            apps/mobile/lib/features/editor/power_workspace_overlay_painter.dart \
            apps/mobile/lib/features/editor/power_workspace_editor_binding.dart \
            apps/mobile/lib/application/power_workspace_overlay_geometry.dart; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/mobile/lib/features/editor/room_editor_screen.dart \
            apps/mobile/lib/features/editor/persisted_room_editor_screen.dart \
            apps/mobile/lib/features/editor/power_workspace_panel.dart \
            apps/mobile/lib/features/editor/power_workspace_panel_host.dart \
            apps/mobile/lib/features/editor/power_workspace_overlay_painter.dart \
            apps/mobile/lib/features/editor/power_workspace_editor_binding.dart \
            apps/mobile/lib/application/power_workspace_overlay_geometry.dart
          git commit -m "feat(elv4): integrate P7 power workspace with room editor"
          git push origin HEAD:${{ github.ref_name }}
