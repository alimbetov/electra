name: ELV2 Round2 Provenance Apply

on:
  push:
    branches:
      - 'audit/elv2-hard-review-round-2'
    paths:
      - '.github/scripts/r2_provenance_apply.py'
      - '.github/workflows/r2-provenance-apply.yml'

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/elv2-hard-review-round-2
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply provenance hardening
        run: python3 .github/scripts/r2_provenance_apply.py
      - name: Format and targeted test
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          dart format lib/data/repositories/drift_engineering_reference_adoption_repository.dart test/data/engineering_reference_adoption_provenance_round2_test.dart
          flutter test test/data/engineering_reference_adoption_provenance_round2_test.dart test/data/engineering_reference_adoption_safety_test.dart test/data/engineering_reference_adoption_persistence_test.dart test/data/engineering_reference_adoption_transaction_boundary_round2_test.dart
      - name: Remove temporary audit workflows
        run: git rm .github/scripts/r2_provenance_apply.py .github/workflows/r2-provenance-apply.yml .github/workflows/r2-provenance-regression.yml
      - name: Commit remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(elv2): harden adoption provenance and no-op semantics'
          git push origin HEAD:audit/elv2-hard-review-round-2
