name: P6 Safety Verify

on:
  push:
    branches:
      - feat/flutter-elv2-profile-constraints
    paths:
      - '.github/workflows/p6-safety-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv2-profile-constraints
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate and format
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          dart format test/data/engineering_reference_adoption_safety_test.dart
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: P6 safety tests
        working-directory: apps/mobile
        run: flutter test test/data/engineering_reference_adoption_safety_test.dart test/data/engineering_reference_adoption_persistence_test.dart
      - name: Commit verified safety test and remove helper
        run: |
          rm .github/workflows/p6-safety-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(elv2): verify P6 connected safety'
          git push origin HEAD:feat/flutter-elv2-profile-constraints
