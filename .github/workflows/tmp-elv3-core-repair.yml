name: Temporary ELV3 Core Repair

on:
  push:
    branches:
      - feat/elv3-runtime-closure
    paths:
      - '.github/workflows/tmp-elv3-core-repair.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/elv3-runtime-closure

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply constructor normalization fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected pattern not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          ref = 'packages/engineering_core/lib/src/elv_cable_reference.dart'
          replace(ref, '    required this.code,\n', '    required String code,\n')
          replace(ref, '    required this.mediaCode,\n', '    required String mediaCode,\n')
          replace(ref, '    this.categoryCode,\n', '    String? categoryCode,\n')
          replace(ref, '    this.conductorMaterialCode,\n', '    String? conductorMaterialCode,\n')
          replace(ref, '    this.shieldingCode,\n', '    String? shieldingCode,\n')
          replace(ref, '    this.firePerformanceCode,\n', '    String? firePerformanceCode,\n')

          term = 'packages/engineering_core/lib/src/elv_cable_termination.dart'
          replace(term, '    required this.resourceIdentity,\n', '    required String resourceIdentity,\n')
          replace(term, '    this.endpointTerminalRef,\n', '    String? endpointTerminalRef,\n')
          replace(term, '    this.terminationRole,\n', '    String? terminationRole,\n')

          pathway = 'packages/engineering_core/lib/src/elv_pathway_context.dart'
          replace(pathway, '      var cursor = parentId;\n', '      String? cursor = parentId;\n')

          profile = 'packages/engineering_core/lib/src/elv_physical_compatibility_profile.dart'
          replace(
              profile,
              '''  AllowedEnvironmentClassRule({\n    required super.selector,\n    required this.dimension,\n    required Iterable<String> allowedCodes,\n  }) : allowedCodes = _codes(allowedCodes);\n''',
              '''  AllowedEnvironmentClassRule({\n    required PhysicalCompatibilitySelector selector,\n    required this.dimension,\n    required Iterable<String> allowedCodes,\n  }) : allowedCodes = _codes(allowedCodes),\n       super(selector);\n''',
          )
          replace(profile, '    required this.code,\n', '    required String code,\n')
          PY

      - name: Format engineering core
        working-directory: packages/engineering_core
        run: dart format lib test

      - name: Capture core analyze output
        working-directory: packages/engineering_core
        shell: bash
        run: |
          set +e
          dart analyze > core-analyze.log 2>&1
          cat core-analyze.log
          exit 0

      - name: Upload core analyzer log
        uses: actions/upload-artifact@v4
        with:
          name: elv3-core-analyze-log
          path: packages/engineering_core/core-analyze.log
