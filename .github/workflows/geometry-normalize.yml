name: Normalize Geometry Changes

on:
  push:
    branches:
      - feat/flutter-geometry-kernel

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/flutter-geometry-kernel

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Normalize changed Dart sources
        run: dart format \
          apps/mobile/lib/features/editor/persisted_room_editor_screen.dart \
          apps/mobile/test/data/geometry_persistence_test.dart \
          apps/mobile/lib/data/database/app_database.dart \
          packages/engineering_core/lib/src/spatial_geometry.dart \
          packages/engineering_core/test/spatial_geometry_test.dart

      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/features/editor/persisted_room_editor_screen.dart \
                  apps/mobile/test/data/geometry_persistence_test.dart \
                  apps/mobile/lib/data/database/app_database.dart \
                  packages/engineering_core/lib/src/spatial_geometry.dart \
                  packages/engineering_core/test/spatial_geometry_test.dart
          if git diff --cached --quiet; then
            echo "Nothing to normalize"
            exit 0
          fi
          git commit -m "style: normalize geometry kernel changes"
          git push origin HEAD:feat/flutter-geometry-kernel
