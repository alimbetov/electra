name: Temporary ELV4 Regression Repair

on:
  push:
    branches:
      - feat/flutter-elv4-power-topology-design
    paths:
      - '.github/workflows/tmp-elv4-test-fix.yml'

permissions:
  contents: write

jobs:
  repair-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flutter-elv4-power-topology-design

      - name: Repair stale schema assertions and SQLite WAL setup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          schema_files = [
              'apps/mobile/test/data/protection_persistence_test.dart',
              'apps/mobile/test/data/elv_p4_runtime_closure_test.dart',
              'apps/mobile/test/data/component_instance_persistence_test.dart',
              'apps/mobile/test/data/engineering_system_persistence_test.dart',
              'apps/mobile/test/data/engineering_placement_repository_test.dart',
              'apps/mobile/test/data/elv4_p2_persistence_test.dart',
              'apps/mobile/test/data/project_hierarchy_persistence_test.dart',
              'apps/mobile/test/data/dependency_recalculation_persistence_test.dart',
              'apps/mobile/test/data/engineering_topology_persistence_test.dart',
              'apps/mobile/test/data/geometry_persistence_test.dart',
              'apps/mobile/test/data/junction_persistence_test.dart',
              'apps/mobile/test/data/manufacturer_persistence_test.dart',
              'apps/mobile/test/data/panel_generation_persistence_test.dart',
              'apps/mobile/test/data/floor_routing_persistence_test.dart',
          ]
          total = 0
          for name in schema_files:
              path = Path(name)
              text = path.read_text()
              updated, count = re.subn(r'(schemaVersion\s*,\s*)(?:21|22)(\s*\))', r'\g<1>23\2', text)
              if count == 0:
                  raise SystemExit(f'No stale schema assertion found in {name}')
              path.write_text(updated)
              print(f'{name}: updated {count} schema assertion(s)')
              total += count
          print(f'Updated {total} stale schema assertion(s)')

          path = Path('apps/mobile/test/data/elv_p2_concurrency_test.dart')
          text = path.read_text()
          old = """QueryExecutor _native(File file) => NativeDatabase.createInBackground(\n  file,\n  setup: (raw) {\n    raw.execute('PRAGMA journal_mode=WAL');\n    raw.execute('PRAGMA busy_timeout=30000');\n  },\n);"""
          new = """QueryExecutor _native(File file, {bool configureWal = false}) =>\n    NativeDatabase.createInBackground(\n      file,\n      setup: (raw) {\n        if (configureWal) {\n          raw.execute('PRAGMA journal_mode=WAL');\n        }\n        raw.execute('PRAGMA busy_timeout=30000');\n      },\n    );"""
          if old not in text:
              raise SystemExit('Expected _native helper shape not found')
          text = text.replace(old, new, 1)
          old_seed = 'final seedDb = AppDatabase(_native(file));'
          new_seed = 'final seedDb = AppDatabase(_native(file, configureWal: true));'
          if old_seed not in text:
              raise SystemExit('Expected seed database open not found')
          text = text.replace(old_seed, new_seed, 1)
          path.write_text(text)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile

      - name: Format repaired tests
        working-directory: apps/mobile
        run: dart format test/data

      - name: Run repaired regression set
        working-directory: apps/mobile
        run: >-
          flutter test
          test/data/protection_persistence_test.dart
          test/data/elv_p4_runtime_closure_test.dart
          test/data/component_instance_persistence_test.dart
          test/data/engineering_system_persistence_test.dart
          test/data/engineering_placement_repository_test.dart
          test/data/elv4_p2_persistence_test.dart
          test/data/project_hierarchy_persistence_test.dart
          test/data/dependency_recalculation_persistence_test.dart
          test/data/engineering_topology_persistence_test.dart
          test/data/geometry_persistence_test.dart
          test/data/junction_persistence_test.dart
          test/data/manufacturer_persistence_test.dart
          test/data/panel_generation_persistence_test.dart
          test/data/floor_routing_persistence_test.dart
          test/data/elv_p2_concurrency_test.dart

      - name: Commit verified regression repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/test/data
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'fix(elv4): align schema regressions and stabilize SQLite race test'
          git push origin HEAD:feat/flutter-elv4-power-topology-design
