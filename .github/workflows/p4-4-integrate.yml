name: P4.4 Integrate Membership

on:
  push:
    branches:
      - 'feat/flutter-elv2-profile-constraints'

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Integrate P4.4 into transaction owner and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('apps/mobile/lib/data/repositories/drift_engineering_placement_repository.dart')
          text = repo.read_text()
          old = """import '../../domain/system_component_catalog.dart';\nimport '../database/app_database.dart';\nimport '../database/geometry_codec.dart';\n"""
          new = """import '../../domain/system_component_catalog.dart';\nimport '../database/app_database.dart';\nimport '../database/geometry_codec.dart';\nimport 'drift_engineering_placement_membership_writer.dart';\n"""
          if old not in text:
              raise SystemExit('placement repository import anchor not found')
          text = text.replace(old, new, 1)

          old = """       );\n\n  final AppDatabase database;\n  final String originDeviceId;\n  final DriftEngineeringPlacementComponentWriter _componentWriter;\n"""
          new = """       ),\n       _membershipWriter = DriftEngineeringPlacementMembershipWriter(\n         database,\n         originDeviceId: originDeviceId,\n         clock: clock,\n       );\n\n  final AppDatabase database;\n  final String originDeviceId;\n  final DriftEngineeringPlacementComponentWriter _componentWriter;\n  final DriftEngineeringPlacementMembershipWriter _membershipWriter;\n"""
          if old not in text:
              raise SystemExit('placement repository constructor anchor not found')
          text = text.replace(old, new, 1)

          old = """      final component = await _componentWriter.insertCanonicalComponent(\n        command,\n      );\n\n      throw EngineeringPlacementFailure(\n        code: EngineeringPlacementFailureCode.transactionFailed,\n        message:\n            'Canonical component created inside the placement transaction, but aggregate writes remain incomplete until P4.4-P4.7.',\n        details: {\n          'operationId': command.operationId,\n          'componentId': component.id,\n          'phase': 'P4.3',\n          'transactionOwner': 'DriftEngineeringPlacementRepository',\n        },\n      );\n"""
          new = """      final component = await _componentWriter.insertCanonicalComponent(\n        command,\n      );\n      final membership = await _membershipWriter.insertCanonicalMembership(\n        command,\n        componentId: component.id,\n      );\n\n      throw EngineeringPlacementFailure(\n        code: EngineeringPlacementFailureCode.transactionFailed,\n        message:\n            'Canonical component and system membership were created inside the placement transaction, but aggregate writes remain incomplete until P4.5-P4.7.',\n        details: {\n          'operationId': command.operationId,\n          'componentId': component.id,\n          'systemId': membership.systemId,\n          'membershipRole': membership.role,\n          'phase': 'P4.4',\n          'transactionOwner': 'DriftEngineeringPlacementRepository',\n        },\n      );\n"""
          if old not in text:
              raise SystemExit('placement repository P4.3 place anchor not found')
          repo.write_text(text.replace(old, new, 1))

          test = Path('apps/mobile/test/data/engineering_placement_repository_test.dart')
          text = test.read_text()
          old = """import 'package:drift/native.dart';\n"""
          new = """import 'package:drift/drift.dart';\nimport 'package:drift/native.dart';\n"""
          if old not in text:
              raise SystemExit('test import anchor not found')
          text = text.replace(old, new, 1)

          old = """import 'package:electra_mobile/data/repositories/drift_engineering_placement_repository.dart';\n"""
          new = """import 'package:electra_mobile/data/repositories/drift_engineering_placement_membership_writer.dart';\nimport 'package:electra_mobile/data/repositories/drift_engineering_placement_repository.dart';\n"""
          if old not in text:
              raise SystemExit('test repository import anchor not found')
          text = text.replace(old, new, 1)

          old = """    await _seedPlacementParents(database);\n"""
          new = """    await _seedPlacementParents(database);\n    await _seedPlacementSystemAndCatalog(database);\n"""
          if old not in text:
              raise SystemExit('test setup anchor not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              "'P4.3 place inserts component only inside transaction then rolls back'",
              "'P4.4 place inserts component and membership inside one transaction then rolls back'",
              1,
          )
          text = text.replace(
              ".having((failure) => failure.details['phase'], 'phase', 'P4.3')",
              ".having((failure) => failure.details['phase'], 'phase', 'P4.4')",
              1,
          )
          old = """      final components =\n          await database.select(database.componentInstances).get();\n      expect(components.map((row) => row.id), ['component-1']);\n"""
          new = """      final components =\n          await database.select(database.componentInstances).get();\n      expect(components.map((row) => row.id), ['component-1']);\n      expect(\n        await database.select(database.componentEngineeringMemberships).get(),\n        isEmpty,\n      );\n"""
          if old not in text:
              raise SystemExit('rollback assertion anchor not found')
          text = text.replace(old, new, 1)

          anchor = """  test(\n    'P4.3 writer rejects placement outside persisted surface geometry',\n"""
          idx = text.find(anchor)
          if idx < 0:
              raise SystemExit('P4.3 final test anchor not found')
          main_end = text.find("\n}\n\nFuture<void> _seedPlacementParents", idx)
          if main_end < 0:
              raise SystemExit('main end anchor not found')
          tests = r'''

  test(
    'P4.4 writer persists exact DEVICE membership identity and audit',
    () async {
      final writer = DriftEngineeringPlacementMembershipWriter(
        database,
        originDeviceId: 'membership-device',
        clock: () => DateTime.utc(2026, 10, 13, 21, 10, 15),
      );

      final membership = await database.transaction(
        () => writer.insertCanonicalMembership(
          _command(),
          componentId: 'component-1',
        ),
      );

      expect(membership.systemId, 'system-1');
      expect(membership.componentId, 'component-1');
      expect(membership.role, canonicalElvMembershipRole);
      final row =
          await database.select(database.componentEngineeringMemberships).getSingle();
      expect(row.systemId, 'system-1');
      expect(row.componentId, 'component-1');
      expect(row.role, canonicalElvMembershipRole);
      expect(row.revision, 1);
      expect(
        row.createdAt.isAtSameMomentAs(
          DateTime.utc(2026, 10, 13, 21, 10, 15),
        ),
        isTrue,
      );
      expect(row.updatedAt.isAtSameMomentAs(row.createdAt), isTrue);
      expect(row.deletedAt, isNull);
      expect(row.originDeviceId, 'membership-device');
    },
  );

  test('P4.4 writer rejects profile and system discipline mismatch', () async {
    await _seedEngineeringSystem(
      database,
      id: 'system-lan',
      code: 'LAN-01',
      familyCode: 'LAN',
    );
    final writer = DriftEngineeringPlacementMembershipWriter(
      database,
      originDeviceId: 'membership-device',
    );

    await expectLater(
      database.transaction(
        () => writer.insertCanonicalMembership(
          _command(systemId: 'system-lan'),
          componentId: 'component-1',
        ),
      ),
      throwsA(
        isA<EngineeringPlacementFailure>().having(
          (failure) => failure.code,
          'code',
          EngineeringPlacementFailureCode.systemDisciplineMismatch,
        ),
      ),
    );
    expect(
      await database.select(database.componentEngineeringMemberships).get(),
      isEmpty,
    );
  });

  test('P4.4 writer rejects existing membership identity without repair', () async {
    final writer = DriftEngineeringPlacementMembershipWriter(
      database,
      originDeviceId: 'membership-device',
      clock: () => DateTime.utc(2026, 10, 13, 21, 20),
    );
    await database.transaction(
      () => writer.insertCanonicalMembership(
        _command(),
        componentId: 'component-1',
      ),
    );

    await expectLater(
      database.transaction(
        () => writer.insertCanonicalMembership(
          _command(),
          componentId: 'component-1',
        ),
      ),
      throwsA(
        isA<EngineeringPlacementFailure>().having(
          (failure) => failure.code,
          'code',
          EngineeringPlacementFailureCode.membershipConflict,
        ),
      ),
    );
    final rows =
        await database.select(database.componentEngineeringMemberships).get();
    expect(rows, hasLength(1));
    expect(rows.single.revision, 1);
    expect(rows.single.role, canonicalElvMembershipRole);
  });
'''
          text = text[:main_end] + tests + text[main_end:]

          seed_anchor = """Future<void> _seedOperation(\n"""
          seed_pos = text.find(seed_anchor)
          if seed_pos < 0:
              raise SystemExit('seed operation anchor not found')
          helpers = r'''
Future<void> _seedPlacementSystemAndCatalog(AppDatabase database) async {
  await _seedEngineeringSystem(
    database,
    id: 'system-1',
    code: 'CCTV-01',
    familyCode: 'CCTV',
  );
  final now = DateTime.utc(2026, 10, 13, 19, 2);
  final catalog = EngineeringReferenceCatalog(
    id: 'catalog-1',
    code: 'ELV-P4-TEST',
    version: '1.0.0',
    source: 'P4 deterministic fixture',
    profiles: [
      ComponentEngineeringProfile(
        code: 'CAMERA',
        label: 'Camera',
        engineeringClass: CanonicalComponentClass.camera,
        characteristics: const CctvCharacteristics(),
        capabilities: const [],
        portTemplates: const [],
      ),
    ],
  );
  await database
      .into(database.engineeringReferenceCatalogs)
      .insert(
        EngineeringReferenceCatalogsCompanion.insert(
          id: catalog.id,
          projectId: 'project-1',
          code: catalog.code,
          catalogVersion: catalog.version,
          payloadJson: canonicalEngineeringJson(catalog.toMap()),
          createdAt: now,
          updatedAt: now,
          originDeviceId: 'p4-test-device',
        ),
      );
}

Future<void> _seedEngineeringSystem(
  AppDatabase database, {
  required String id,
  required String code,
  required String familyCode,
}) async {
  final family =
      await (database.select(database.engineeringFamilyDefinitions)..where(
        (row) => row.code.equals(familyCode) & row.deletedAt.isNull(),
      )).getSingle();
  final system = EngineeringSystem(
    id: id,
    projectId: 'project-1',
    code: code,
    name: code,
    familyId: family.id,
    familyVersion: family.familyVersion,
  );
  final now = DateTime.utc(2026, 10, 13, 19, 1);
  await database
      .into(database.projectEngineeringSystems)
      .insert(
        ProjectEngineeringSystemsCompanion.insert(
          id: system.id,
          projectId: system.projectId,
          code: system.code,
          familyId: system.familyId,
          payloadJson: canonicalEngineeringJson(system.toMap()),
          revision: const Value(1),
          createdAt: now,
          updatedAt: now,
          originDeviceId: 'p4-test-device',
        ),
      );
}

'''
          text = text[:seed_pos] + helpers + text[seed_pos:]

          old = """  String projectId = 'project-1',\n  Point2Mm localPosition = const Point2Mm(120, 80),\n"""
          new = """  String projectId = 'project-1',\n  String systemId = 'system-1',\n  Point2Mm localPosition = const Point2Mm(120, 80),\n"""
          if old not in text:
              raise SystemExit('command signature anchor not found')
          text = text.replace(old, new, 1)
          old = """  systemId: 'system-1',\n"""
          new = """  systemId: systemId,\n"""
          command_pos = text.find('PlaceEngineeringProfileCommand _command')
          before, after = text[:command_pos], text[command_pos:]
          if old not in after:
              raise SystemExit('command systemId anchor not found')
          after = after.replace(old, new, 1)
          test.write_text(before + after)
          PY

          cd apps/mobile
          flutter pub get --enforce-lockfile
          dart run build_runner build
          dart format lib/data/repositories/drift_engineering_placement_repository.dart \
            lib/data/repositories/drift_engineering_placement_membership_writer.dart \
            test/data/engineering_placement_repository_test.dart
      - name: Commit P4.4 integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/lib/data/repositories/drift_engineering_placement_repository.dart \
            apps/mobile/lib/data/repositories/drift_engineering_placement_membership_writer.dart \
            apps/mobile/test/data/engineering_placement_repository_test.dart
          git commit -m "feat(elv2): integrate P4.4 canonical system membership"
          git push origin HEAD:feat/flutter-elv2-profile-constraints
