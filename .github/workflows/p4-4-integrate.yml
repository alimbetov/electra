name: P4.4 Integrate Membership

on:
  push:
    branches:
      - 'feat/flutter-elv2-profile-constraints'

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply P4.4 integration patch
        run: python .github/scripts/p4_4_integrate.py
      - name: Format P4.4 files using CI toolchain
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          dart format lib/data/repositories/drift_engineering_placement_repository.dart \
            lib/data/repositories/drift_engineering_placement_membership_writer.dart \
            test/data/engineering_placement_repository_test.dart
      - name: Commit P4.4 integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mobile/lib/data/repositories/drift_engineering_placement_repository.dart \
            apps/mobile/lib/data/repositories/drift_engineering_placement_membership_writer.dart \
            apps/mobile/test/data/engineering_placement_repository_test.dart
          git commit -m "feat(elv2): integrate P4.4 canonical system membership"
          git push origin HEAD:feat/flutter-elv2-profile-constraints
